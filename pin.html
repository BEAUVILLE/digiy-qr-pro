<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#061b14"/>
  <title>DIGIY PRO — PIN</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#061b14; --card:#0b2a1f; --line:rgba(255,255,255,.14);
      --text:#eafff1; --muted:rgba(234,255,241,.72);
      --gold:#facc15; --ok:#22c55e; --bad:#fb7185; --warn:#f59e0b;
      --shadow:0 18px 55px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:
        radial-gradient(circle at top, rgba(250,204,21,.10), transparent 55%),
        radial-gradient(circle at bottom right, rgba(34,197,94,.10), transparent 45%),
        linear-gradient(135deg,#04160f,#0a2b1f);
      color:var(--text); padding:18px;
    }
    .card{
      width:min(620px,92vw);
      background:linear-gradient(145deg,rgba(11,42,31,.96),rgba(6,35,25,.96));
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:20px;
    }
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .ico{
      width:46px;height:46px;border-radius:50%;
      display:grid;place-items:center;
      background:radial-gradient(circle at 30% 0,var(--gold),transparent 60%);
      color:#062015;font-weight:900;
      border:1px solid rgba(250,204,21,.35);
    }
    .t{font-weight:900;letter-spacing:.12em;font-size:12px}
    .sub{font-size:12px;color:var(--muted);margin-top:4px}
    .pill{
      border:1px solid var(--line);
      background:rgba(250,204,21,.10);
      padding:7px 10px;border-radius:999px;
      font-size:12px;font-weight:900;
      white-space:nowrap;
    }
    .sep{height:1px;background:var(--line);margin:16px 0}

    .mini{font-size:12px;color:var(--muted);line-height:1.45}
    .mini b{color:var(--text)}

    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row > *{flex:1;min-width:220px}

    label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
    input{
      width:100%; padding:14px;
      border-radius:14px; border:1px solid var(--line);
      background:rgba(0,0,0,.22); color:var(--text);
      font-size:15px; font-weight:800;
      outline:none;
    }
    #pin{letter-spacing:.18em;font-size:18px}

    button{
      width:100%; margin-top:12px; padding:14px;
      border-radius:14px; border:none;
      background:linear-gradient(90deg,var(--ok),var(--gold));
      color:#062015; font-weight:900; font-size:15px;
      cursor:pointer;
      transition:transform .12s ease, filter .12s ease, opacity .12s ease;
    }
    button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.04)}
    button.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.16);
      color:var(--text);
    }
    button.danger{
      background:rgba(251,113,133,.10);
      border:1px solid rgba(251,113,133,.35);
      color:var(--text);
    }
    button:disabled{opacity:.6;cursor:not-allowed}

    .box{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      background:rgba(0,0,0,.12);
      margin-top:14px;
    }

    .msg{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5}
    .ok{color:var(--ok);font-weight:900}
    .bad{color:var(--bad);font-weight:900}
    .warn{color:var(--warn);font-weight:900}
    .hidden{display:none !important}
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="ico">👑</div>
        <div>
          <div class="t">PIN DIGIY — MOULE</div>
          <div class="sub" id="subtitle">Lecture des paramètres…</div>
        </div>
      </div>
      <div class="pill" id="modulePill">module: —</div>
    </div>

    <div class="sep"></div>

    <div class="mini">
      MODULE : <b id="moduleBox">—</b><br>
      SLUG : <b id="slugBox">—</b><br>
      TÉLÉPHONE : <b id="phoneBox">—</b><br>
      RETURN : <b id="returnBox">—</b>
    </div>

    <div class="box" id="rescueBox">
      <div class="mini"><b>🔎 Recherche d’accès</b> — utile si tu arrives sans slug.</div>
      <div class="row">
        <div>
          <label>Téléphone (digits)</label>
          <input id="rescuePhone" inputmode="numeric" placeholder="Ex: 221771234567" maxlength="15"/>
        </div>
        <div>
          <label>Module</label>
          <input id="rescueModule" placeholder="Ex: LOC / DRIVER / POS / MARKET" maxlength="30"/>
        </div>
      </div>
      <button class="secondary" id="btnFindSlug">🧭 Trouver mon accès</button>
      <div class="msg" id="rescueMsg"></div>
    </div>

    <label>Entre ton PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"/>

    <button id="go">🚀 ENTRER</button>
    <button class="secondary" id="btnBack">⬅️ Retour</button>
    <button class="danger hidden" id="btnSupport">🛟 Support WhatsApp</button>

    <div class="msg" id="msg"></div>
  </div>

<script>
(async () => {
  "use strict";

  const CONFIG = {
    SUPABASE_URL:
      window.DIGIY_SUPABASE_URL ||
      "https://wesqmwjjtsefyjnluosj.supabase.co",

    SUPABASE_ANON_KEY:
      window.DIGIY_SUPABASE_ANON ||
      window.DIGIY_SUPABASE_ANON_KEY ||
      "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3",

    SUPPORT_WA:
      window.DIGIY_SUPPORT_WA || "",

    RPC_VERIFY:
      window.DIGIY_VERIFY_RPC || "digiy_verify_access",

    PUBLIC_SUBS_VIEW:
      window.DIGIY_SUBS_VIEW || "digiy_subscriptions_public",

    MODULE_ALIAS:
      Object.assign({}, window.DIGIY_MODULE_ALIAS || {}),

    DEFAULT_RETURN_BY_MODULE:
      Object.assign({
        LOC: "./app.html",
        DRIVER: "./cockpit.html",
        MARKET: "./dashboard.html",
        POS: "./dashboard.html",
        CAISSE: "./dashboard.html",
        BUILD: "./cockpit.html",
        JOBS: "./cockpit.html",
        PAY: "./cockpit.html",
        EXPLORE: "./cockpit.html",
        RESA: "./cockpit.html",
        RESTO: "./cockpit.html",
        FRET: "./cockpit.html"
      }, window.DIGIY_DEFAULT_RETURN_BY_MODULE || {})
  };

  const SESSION_KEY_TEL = "DIGIY_PIN_MOULE_TEL";
  const SESSION_KEY_ACCESS = "DIGIY_ACCESS";

  const $ = id => document.getElementById(id);
  const setMsg = html => $("msg").innerHTML = html;
  const setRescueMsg = html => $("rescueMsg").innerHTML = html;

  const url = new URL(location.href);

  function cleanDigits(v){
    return String(v || "").replace(/[^\d]/g, "").slice(0, 15);
  }

  function cleanModule(v){
    return String(v || "").toUpperCase().replace(/[^A-Z0-9_]/g, "");
  }

  function cleanPin(v){
    return String(v || "").replace(/[^\d]/g, "").slice(0, 8);
  }

  function normalizeModule(v){
    const raw = cleanModule(v);
    return CONFIG.MODULE_ALIAS[raw] || raw;
  }

  function safeUrl(value){
    const raw = String(value || "").trim();
    if(!raw) return "";
    try{
      const u = new URL(raw, location.href);
      if(!/^https?:$/i.test(u.protocol)) return "";
      return u.toString();
    }catch(_){
      return "";
    }
  }

  function last4Digits(v){
    const d = cleanDigits(v);
    return d ? d.slice(-4) : "";
  }

  function maskPhone(v){
    const d = cleanDigits(v);
    if(!d) return "—";
    return "***" + d.slice(-4);
  }

  function setBusy(on){
    $("go").disabled = !!on;
    $("btnFindSlug").disabled = !!on;
    $("btnBack").disabled = !!on;
    $("btnSupport").disabled = !!on;
  }

  function dedupe(list){
    return [...new Set((list || []).filter(Boolean))];
  }

  function updateView(){
    $("moduleBox").textContent = currentModule || "—";
    $("modulePill").textContent = "module: " + (currentModule || "—");
    $("slugBox").textContent = currentSlug || "—";
    $("phoneBox").textContent = maskPhone(currentPhone);
    $("returnBox").textContent = returnUrl || autoReturnHint();

    $("rescuePhone").value = "";
    $("rescuePhone").placeholder = currentPhone
      ? "Téléphone retrouvé · " + maskPhone(currentPhone)
      : "Ex: 221771234567";

    $("rescueModule").value = currentModule || "";

    if(currentSlug){
      $("subtitle").textContent = "Slug présent — vérification PIN";
    } else {
      $("subtitle").textContent = "Mode recherche d’accès";
    }
  }

  function autoReturnHint(){
    const candidate = CONFIG.DEFAULT_RETURN_BY_MODULE[currentModule] || "";
    return candidate ? `(auto) ${candidate}` : "—";
  }

  function syncUrl(){
    const u = new URL(location.href);

    if(currentModule) u.searchParams.set("module", currentModule);
    else u.searchParams.delete("module");

    if(currentSlug) u.searchParams.set("slug", currentSlug);
    else u.searchParams.delete("slug");

    const telHint = last4Digits(currentPhone);
    if(telHint) u.searchParams.set("tel_hint", telHint);
    else u.searchParams.delete("tel_hint");

    u.searchParams.delete("tel");
    u.searchParams.delete("phone");

    if(returnUrl) u.searchParams.set("return", returnUrl);
    else u.searchParams.delete("return");

    if(publicUrl) u.searchParams.set("public", publicUrl);
    else u.searchParams.delete("public");

    history.replaceState({}, "", u.toString());
  }

  function saveAccessSession(){
    const payload = {
      slug: currentSlug,
      module: currentModule,
      phone: currentPhone,
      access_ok: true,
      ts: Date.now(),
      source: "pin_moule"
    };

    try{
      localStorage.setItem(SESSION_KEY_ACCESS, JSON.stringify(payload));
    }catch(_){}

    try{
      sessionStorage.setItem(SESSION_KEY_TEL, currentPhone || "");
    }catch(_){}

    try{
      if(currentModule){
        localStorage.setItem(`DIGIY_${currentModule}_SESSION`, JSON.stringify(payload));
      }
    }catch(_){}
  }

  function injectCtx(baseUrl){
    const u = new URL(baseUrl, location.href);
    if(currentSlug) u.searchParams.set("slug", currentSlug);
    if(currentModule) u.searchParams.set("module", currentModule);
    u.searchParams.set("from", "pin_moule");
    return u.toString();
  }

  async function canOpen(rawUrl){
    const full = safeUrl(rawUrl);
    if(!full) return false;

    try{
      const u = new URL(full, location.href);

      if(u.origin !== location.origin){
        return true;
      }

      const res = await fetch(u.toString(), {
        method: "GET",
        cache: "no-store",
        credentials: "same-origin"
      });

      return !!res.ok;
    }catch(_){
      return false;
    }
  }

  function buildFallbackCandidates(){
    const candidates = [];

    if(returnUrl) candidates.push(returnUrl);

    const mapped = CONFIG.DEFAULT_RETURN_BY_MODULE[currentModule] || "";
    if(mapped) candidates.push(mapped);

    if(currentModule === "LOC"){
      candidates.push("./app.html", "./dashboard.html", "./cockpit.html", "./index.html");
    } else {
      candidates.push("./cockpit.html", "./dashboard.html", "./app.html", "./index.html");
    }

    if(publicUrl) candidates.push(publicUrl);
    candidates.push("./");

    return dedupe(candidates);
  }

  async function resolveNextUrl(){
    for(const candidate of buildFallbackCandidates()){
      if(await canOpen(candidate)){
        return injectCtx(candidate);
      }
    }
    return "";
  }

  async function goNext(){
    const target = await resolveNextUrl();

    if(target){
      location.href = target;
      return;
    }

    setMsg(`<span class="ok">Accès validé.</span> Aucune sortie valide trouvée.`);
  }

  function goBack(){
    if(document.referrer){
      history.back();
      return;
    }
    if(publicUrl){
      location.href = publicUrl;
      return;
    }
    location.href = "./";
  }

  function openSupport(){
    if(!CONFIG.SUPPORT_WA) return;
    const num = CONFIG.SUPPORT_WA.replace(/\+/g, "");
    const text =
      "DIGIY PRO - Problème PIN\n" +
      "Module: " + (currentModule || "-") + "\n" +
      "Slug: " + (currentSlug || "-") + "\n" +
      "Téléphone: " + maskPhone(currentPhone);
    location.href = "https://wa.me/" + num + "?text=" + encodeURIComponent(text);
  }

  if(!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY){
    setMsg(`<span class="bad">Configuration Supabase manquante.</span>`);
    $("go").disabled = true;
    $("btnFindSlug").disabled = true;
    return;
  }

  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
  });

  let currentModule = normalizeModule(url.searchParams.get("module") || "");
  let currentSlug = String(url.searchParams.get("slug") || "").trim().toLowerCase();
  let currentPhone = cleanDigits(url.searchParams.get("tel") || url.searchParams.get("phone") || "");
  const returnUrl = safeUrl(url.searchParams.get("return") || url.searchParams.get("app") || "");
  const publicUrl = safeUrl(url.searchParams.get("public") || "");

  try{
    if(!currentPhone){
      currentPhone = cleanDigits(sessionStorage.getItem(SESSION_KEY_TEL) || "");
    }
  }catch(_){}

  if(CONFIG.SUPPORT_WA){
    $("btnSupport").classList.remove("hidden");
  }

  updateView();
  syncUrl();

  async function resolvePhoneBySlug(){
    if(!currentSlug || currentPhone || !currentModule) return;

    try{
      const { data, error } = await sb
        .from(CONFIG.PUBLIC_SUBS_VIEW)
        .select("phone, slug, module")
        .eq("slug", currentSlug)
        .eq("module", currentModule)
        .limit(1);

      if(error){
        console.warn("resolvePhoneBySlug error", error);
        return;
      }

      if(data && data[0]?.phone){
        currentPhone = cleanDigits(data[0].phone);
        try{
          sessionStorage.setItem(SESSION_KEY_TEL, currentPhone);
        }catch(_){}
        updateView();
        syncUrl();
      }
    }catch(e){
      console.warn("resolvePhoneBySlug fail", e);
    }
  }

  await resolvePhoneBySlug();

  $("btnFindSlug").addEventListener("click", async () => {
    const phone = cleanDigits($("rescuePhone").value || currentPhone);
    const mod = normalizeModule($("rescueModule").value);

    if(phone.length < 9){
      setRescueMsg(`<span class="bad">Téléphone invalide.</span>`);
      return;
    }
    if(!mod){
      setRescueMsg(`<span class="bad">Module manquant.</span>`);
      return;
    }

    setBusy(true);
    setRescueMsg(`<span class="warn">Recherche en cours…</span>`);

    try{
      const { data, error } = await sb
        .from(CONFIG.PUBLIC_SUBS_VIEW)
        .select("slug, phone, module")
        .eq("phone", phone)
        .eq("module", mod)
        .limit(1);

      if(error){
        console.error(error);
        setRescueMsg(`<span class="bad">Recherche KO.</span>`);
        return;
      }

      if(!data || !data[0]){
        setRescueMsg(`<span class="bad">Aucun accès trouvé.</span>`);
        return;
      }

      currentSlug = String(data[0].slug || "").trim().toLowerCase();
      currentPhone = cleanDigits(data[0].phone || phone);
      currentModule = normalizeModule(data[0].module || mod);

      try{
        sessionStorage.setItem(SESSION_KEY_TEL, currentPhone);
      }catch(_){}

      updateView();
      syncUrl();

      setRescueMsg(`<span class="ok">Accès trouvé.</span> Entre ton PIN.`);
      setMsg(`<span class="ok">Slug retrouvé.</span> PIN requis.`);
      $("pin").focus();
    }catch(e){
      console.error(e);
      setRescueMsg(`<span class="bad">Erreur technique.</span>`);
    }finally{
      setBusy(false);
    }
  });

  async function enter(){
    const pin = cleanPin($("pin").value);

    if(!currentModule){
      setMsg(`<span class="bad">Module manquant.</span>`);
      return;
    }

    if(!currentSlug){
      setMsg(`<span class="bad">Slug manquant.</span> Utilise la recherche d’accès.`);
      return;
    }

    if(pin.length < 3){
      setMsg(`<span class="bad">PIN invalide.</span>`);
      return;
    }

    setBusy(true);
    setMsg(`<span class="warn">Vérification…</span>`);

    try{
      const { data, error } = await sb.rpc(CONFIG.RPC_VERIFY, {
        p_slug: currentSlug,
        p_pin: pin,
        p_module: currentModule
      });

      if(error){
        console.error(error);
        setMsg(`<span class="bad">Erreur RPC.</span>`);
        return;
      }

      const ok =
        data === true ||
        data?.ok === true ||
        data?.access_ok === true;

      if(!ok){
        setMsg(`<span class="bad">Accès refusé.</span>`);
        return;
      }

      if(!currentPhone){
        currentPhone = cleanDigits(data?.phone || "");
      }

      try{
        sessionStorage.setItem(SESSION_KEY_TEL, currentPhone || "");
      }catch(_){}

      saveAccessSession();
      updateView();
      syncUrl();

      setMsg(`<span class="ok">Accès validé.</span> Redirection…`);
      setTimeout(() => { goNext(); }, 220);
    }catch(e){
      console.error(e);
      setMsg(`<span class="bad">Erreur technique.</span>`);
    }finally{
      setBusy(false);
    }
  }

  $("go").addEventListener("click", enter);

  $("pin").addEventListener("input", e => {
    e.target.value = cleanPin(e.target.value);
  });

  $("pin").addEventListener("keydown", e => {
    if(e.key === "Enter") enter();
  });

  $("btnBack").addEventListener("click", goBack);

  $("btnSupport").addEventListener("click", openSupport);

})();
</script>
</body>
</html>
